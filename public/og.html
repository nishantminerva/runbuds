<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    background: #111111;
    background-image:
      radial-gradient(ellipse 700px 360px at 50% 0%, rgba(200, 255, 0, 0.12) 0%, transparent 65%),
      radial-gradient(circle 200px at 12% 95%, rgba(200, 255, 0, 0.06) 0%, transparent 70%),
      radial-gradient(circle 200px at 88% 95%, rgba(200, 255, 0, 0.06) 0%, transparent 70%);
    color: #fff;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Subtle starfield-ish particles */
  .dot {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #c8ff00;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(200, 255, 0, 0.6);
    opacity: 0.5;
  }

  /* Memoji avatars */
  .memoji {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 14px 36px rgba(0, 0, 0, 0.55),
      0 0 0 4px rgba(200, 255, 0, 0.28);
  }

  .badge {
    position: absolute;
    background: #c8ff00;
    color: #111;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 900;
    font-family: "SF Mono", Menlo, monospace;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
    border: 3px solid #111;
    line-height: 1;
    white-space: nowrap;
  }

  /* Top-left: Hugh (tour mgr) */
  .m1 { top: 56px; left: 80px; width: 116px; height: 116px; font-size: 76px; }
  .m1 .badge { bottom: 0; right: -14px; }

  /* Top-right: Lex (driver) */
  .m2 { top: 60px; right: 64px; width: 110px; height: 110px; font-size: 72px; }
  .m2 .badge { bottom: -2px; left: -22px; }

  /* Mid-left small */
  .m3 { top: 280px; left: 32px; width: 80px; height: 80px; font-size: 50px; }
  .m3 .badge { top: -4px; right: -28px; font-size: 13px; padding: 3px 8px; }

  /* Mid-right peeking memoji */
  .m4 { top: 290px; right: -34px; width: 100px; height: 100px; font-size: 64px; }
  .m4 .badge { bottom: 4px; left: -30px; }

  /* Bottom-left */
  .m5 { bottom: 60px; left: 110px; width: 100px; height: 100px; font-size: 64px; }
  .m5 .badge { top: -8px; right: -10px; }

  /* Decorative emoji */
  .deco {
    position: absolute;
    line-height: 1;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.55));
  }
  .d-plane { top: 168px; left: 220px; font-size: 60px; transform: rotate(-12deg); }
  .d-guitar { bottom: 70px; right: 88px; font-size: 88px; transform: rotate(8deg); }
  .d-mic { top: 200px; right: 220px; font-size: 52px; transform: rotate(14deg); }

  /* Center column: app icon + headline */
  .center-col {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    width: 900px;
  }

  .icon-tile {
    width: 168px;
    height: 168px;
    background: #c8ff00;
    border-radius: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 24px 56px rgba(200, 255, 0, 0.32),
      0 0 0 1px rgba(200, 255, 0, 0.5),
      0 8px 16px rgba(0, 0, 0, 0.5);
  }

  .icon-A {
    font-size: 152px;
    font-weight: 900;
    font-style: italic;
    color: #111;
    font-family: "Helvetica Neue", "Arial Black", sans-serif;
    line-height: 1;
    letter-spacing: -8px;
    transform: translateY(-6px);
  }

  .headline {
    width: 100%;
    text-align: center;
    font-size: 56px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -1.2px;
    color: #f5f5f5;
  }

  .headline .accent {
    color: #c8ff00;
  }

  /* Wordmark in corner */
  .wordmark {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: "SF Pro Display", -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 4px;
    color: rgba(200, 255, 0, 0.8);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .wm-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c8ff00;
    box-shadow: 0 0 8px rgba(200, 255, 0, 0.85);
  }
</style>
</head>
<body>
  <!-- Ambient dots scattered -->
  <span class="dot" style="top: 90px; left: 480px;"></span>
  <span class="dot" style="top: 120px; right: 320px;"></span>
  <span class="dot" style="top: 380px; left: 380px; opacity: 0.4;"></span>
  <span class="dot" style="bottom: 80px; left: 540px;"></span>
  <span class="dot" style="bottom: 140px; right: 380px; opacity: 0.6;"></span>
  <span class="dot" style="top: 220px; right: 80px; opacity: 0.4;"></span>

  <!-- Wordmark -->
  <div class="wordmark">
    <span class="wm-dot"></span>
    ADVANCE · LIVE TOUR
  </div>

  <!-- Memoji avatars -->
  <div class="memoji m1">
    🧑🏻‍💼
    <span class="badge">23</span>
  </div>
  <div class="memoji m2">
    👨🏼‍✈️
    <span class="badge">PAR</span>
  </div>
  <div class="memoji m3">
    👩🏼‍🦰
    <span class="badge">FOH</span>
  </div>
  <div class="memoji m4">
    👨🏾‍🎤
    <span class="badge">12</span>
  </div>
  <div class="memoji m5">
    🧔🏽
    <span class="badge">BCN</span>
  </div>

  <!-- Decorative tour emojis -->
  <span class="deco d-plane">✈️</span>
  <span class="deco d-guitar">🎸</span>
  <span class="deco d-mic">🎤</span>

  <!-- Center: icon + headline -->
  <div class="center-col">
    <div class="icon-tile"><span class="icon-A">A</span></div>
    <div class="headline">
      The intelligent platform for<br>
      <span class="accent">tour management</span>
    </div>
  </div>
</body>
</html>
